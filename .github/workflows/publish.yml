name: Publish to DEV.TO

on:
  push:
    branches:
      - main
    paths:
      - 'blog-posts/**/*.md'  # Only trigger on markdown file changes
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual publishing)'
        type: boolean
        default: true
      file_path:
        description: 'Specific file to publish (leave empty for all)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Set a reasonable timeout
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1  # Shallow clone for speed

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install minimal dependencies
        run: npm install --no-save axios front-matter

      - name: Create uploading script
        run: |
          cat > publish.js << 'EOL'
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios');
          const fm = require('front-matter');
          const { exec } = require('child_process');
          const { promisify } = require('util');
          const execAsync = promisify(exec);

          // Check if API key is provided
          const apiKey = process.env.DEVTO_API_KEY;
          if (!apiKey) {
            console.error('Error: DEVTO_API_KEY environment variable is required');
            process.exit(1);
          }

          // Parse command line arguments
          const dryRun = process.env.DRY_RUN === 'true';
          const specificFile = process.env.FILE_PATH || null;
          const folder = 'blog-posts';

          // Find all article.md files
          function findArticleFiles(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            
            list.forEach(file => {
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);
              
              if (stat.isDirectory()) {
                results = results.concat(findArticleFiles(filePath));
              } else if (file === 'article.md') {
                results.push(filePath);
              }
            });
            
            return results;
          }

          // Process markdown content to use regular URLs for images
          function processMarkdown(content, filePath) {
            // For local article, we'll embed the images directly
            // Return as is for now - we'll replace image references after uploading
            return content;
          }

          // Function to upload a single image using curl to the DEV.TO API
          async function uploadImageToDev(imagePath) {
            try {
              console.log(`Uploading image: ${imagePath}`);
              if (dryRun) {
                return {
                  success: true,
                  url: `https://example.com/${path.basename(imagePath)}`,
                  dryRun: true
                };
              }

              // Use curl to upload the image
              const cmd = `curl -X POST --location "https://dev.to/api/images" \
                            -H "Content-Type: multipart/form-data" \
                            -H "api-key: ${apiKey}" \
                            -F "image=@${imagePath}"`;
              
              const { stdout, stderr } = await execAsync(cmd);
              if (stderr && !stdout) {
                throw new Error(`Failed to upload image: ${stderr}`);
              }

              const response = JSON.parse(stdout);
              return {
                success: true,
                url: response.image[0] // The URL of the uploaded image
              };
            } catch (error) {
              console.error(`Error uploading image ${imagePath}: ${error.message}`);
              return {
                success: false,
                error: error.message
              };
            }
          }

          // Find and upload all images referenced in an article
          async function uploadImagesForArticle(file) {
            try {
              console.log(`Looking for images for article: ${file}`);
              const content = fs.readFileSync(file, 'utf8');
              const articleDir = path.dirname(file);
              const assetsDir = path.join(articleDir, 'assets');
              
              // Skip if no assets directory
              if (!fs.existsSync(assetsDir)) {
                console.log(`No assets directory found for ${file}, skipping image uploads`);
                return { content, imageMap: {} };
              }
              
              // Find all image references in markdown content
              const imageRegex = /!\[(.*?)\]\((\.\/assets\/[^)]+|assets\/[^)]+)\)/g;
              let match;
              const imagePaths = [];
              
              while ((match = imageRegex.exec(content)) !== null) {
                const imagePath = match[2].replace('./assets/', '').replace('assets/', '');
                const fullImagePath = path.join(articleDir, 'assets', imagePath);
                if (fs.existsSync(fullImagePath)) {
                  imagePaths.push({
                    reference: match[2],
                    path: fullImagePath
                  });
                }
              }
              
              console.log(`Found ${imagePaths.length} images to upload`);
              
              // Upload each image
              const imageMap = {};
              for (const img of imagePaths) {
                const result = await uploadImageToDev(img.path);
                if (result.success) {
                  imageMap[img.reference] = result.url;
                  console.log(`Uploaded ${img.path} → ${result.url}${result.dryRun ? ' (DRY RUN)' : ''}`);
                } else {
                  console.error(`Failed to upload ${img.path}: ${result.error}`);
                }
              }
              
              // Replace image references in content
              let updatedContent = content;
              for (const [reference, url] of Object.entries(imageMap)) {
                updatedContent = updatedContent.replace(
                  new RegExp(`!\\[(.*?)\\]\\(${reference.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\)`, 'g'),
                  `![$1](${url})`
                );
              }
              
              return { content: updatedContent, imageMap };
            } catch (error) {
              console.error(`Error processing images for article ${file}: ${error.message}`);
              return { content: fs.readFileSync(file, 'utf8'), imageMap: {} };
            }
          }

          async function publishArticle(file) {
            try {
              console.log(`Processing file: ${file}`);
              const rawContent = fs.readFileSync(file, 'utf8');
              const { attributes } = fm(rawContent);
              
              // Skip files with published: false unless they're being explicitly published
              if (attributes.published === false && !specificFile) {
                console.log(`Skipping ${file} because published is set to false`);
                return { success: false, skipped: true, file, title: attributes.title };
              }
              
              // Upload images and get updated content
              console.log(`Uploading images for ${file}...`);
              const { content: updatedContent, imageMap } = await uploadImagesForArticle(file);
              
              // Extract front matter from updated content
              const { attributes: updatedAttributes, body } = fm(updatedContent);
              
              // Check tag count and limit to 4 if needed
              let tags = updatedAttributes.tags ? updatedAttributes.tags.split(',').map(tag => tag.trim()) : [];
              if (tags.length > 4) {
                console.log(`Warning: Limiting tags to 4 (was ${tags.length})`);
                tags = tags.slice(0, 4);
              }
              
              const article = {
                article: {
                  title: updatedAttributes.title,
                  published: updatedAttributes.published !== false,
                  body_markdown: updatedContent,
                  tags: tags,
                }
              };
              
              if (updatedAttributes.cover_image && !updatedAttributes.cover_image.startsWith('./assets/')) {
                article.article.main_image = updatedAttributes.cover_image;
              }
              
              if (updatedAttributes.canonical_url) article.article.canonical_url = updatedAttributes.canonical_url;
              if (updatedAttributes.series) article.article.series = updatedAttributes.series;
              
              console.log(`${dryRun ? '[DRY RUN] ' : ''}Publishing article: ${updatedAttributes.title}`);
              console.log(`Tags: ${tags.join(', ')}`);
              
              if (!dryRun) {
                try {
                  const response = await axios.post('https://dev.to/api/articles', article, {
                    headers: {
                      'api-key': apiKey,
                      'Content-Type': 'application/json'
                    }
                  });
                  console.log(`Successfully published: ${response.data.url}`);
                  return { success: true, url: response.data.url, title: updatedAttributes.title, file };
                } catch (error) {
                  console.error(`Error publishing article: ${error.message}`);
                  if (error.response) {
                    console.error(`Status: ${error.response.status}`);
                    console.error(`Response: ${JSON.stringify(error.response.data, null, 2)}`);
                  }
                  return { success: false, error: error.message, file };
                }
              } else {
                console.log('Article would be published with title:', article.article.title);
                return { success: true, dryRun: true, title: updatedAttributes.title, file };
              }
            } catch (error) {
              console.error(`Error processing file ${file}: ${error.message}`);
              return { success: false, error: error.message, file };
            }
          }

          async function run() {
            try {
              let files = [];
              
              if (specificFile) {
                // Use a specific file
                if (!fs.existsSync(specificFile)) {
                  console.error(`Error: File ${specificFile} does not exist`);
                  process.exit(1);
                }
                
                if (!specificFile.endsWith('.md')) {
                  console.error('Error: Only markdown (.md) files are supported');
                  process.exit(1);
                }
                
                files = [specificFile];
                console.log(`Publishing single file: ${specificFile}`);
              } else {
                // Find article.md files in the folder
                console.log(`Looking for article.md files in ${folder}...`);
                files = findArticleFiles(folder);
                console.log(`Found ${files.length} article.md files to process`);
              }
              
              if (files.length === 0) {
                console.log('No article.md files found to publish.');
                return;
              }
              
              const results = { successful: [], failed: [], skipped: [] };
              
              for (const file of files) {
                const result = await publishArticle(file);
                if (result.success) {
                  results.successful.push({
                    file: result.file,
                    title: result.title,
                    url: result.url,
                    dryRun: !!result.dryRun
                  });
                } else if (result.skipped) {
                  results.skipped.push({
                    file: result.file,
                    title: result.title
                  });
                } else {
                  results.failed.push({
                    file: result.file,
                    error: result.error
                  });
                }
              }
              
              // Print summary
              console.log('\n======= PUBLISHING SUMMARY =======');
              console.log(`Total files processed: ${files.length}`);
              console.log(`Successful: ${results.successful.length}`);
              console.log(`Failed: ${results.failed.length}`);
              console.log(`Skipped: ${results.skipped.length}`);
              
              if (results.successful.length > 0) {
                console.log('\nSuccessfully published/would publish:');
                results.successful.forEach(item => {
                  console.log(`- ${item.file}${item.dryRun ? ' (DRY RUN)' : ''}`);
                });
              }
            } catch (error) {
              console.error(`Error: ${error.message}`);
              process.exit(1);
            }
          }

          run();
          EOL

      - name: Run publish script
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FILE_PATH: ${{ github.event.inputs.file_path }}
        run: node publish.js