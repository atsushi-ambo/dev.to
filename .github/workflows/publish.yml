name: Publish to dev.to

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install axios front-matter

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E '^blog-posts/.*\.md$' || true)
          else
            CHANGED_FILES=$(find blog-posts -type f -name "*.md")
          fi
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          
      - name: Publish articles
        if: steps.changed-files.outputs.files != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          cat > publish.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios');
          const fm = require('front-matter');
          
          const apiKey = process.env.DEVTO_API_KEY;
          const dryRun = process.argv.includes('--dryRun');
          
          const files = process.argv[2].split(' ').filter(f => f);
          
          async function publishArticle(file) {
            const content = fs.readFileSync(file, 'utf8');
            const { attributes, body } = fm(content);
            
            const article = {
              article: {
                title: attributes.title,
                published: attributes.published,
                body_markdown: content,
                tags: attributes.tags ? attributes.tags.split(',').map(tag => tag.trim()) : [],
              }
            };
            
            if (attributes.cover_image) {
              article.article.main_image = attributes.cover_image;
            }
            
            if (attributes.canonical_url) {
              article.article.canonical_url = attributes.canonical_url;
            }
            
            if (attributes.series) {
              article.article.series = attributes.series;
            }
            
            console.log(`${dryRun ? '[DRY RUN] ' : ''}Publishing article: ${attributes.title}`);
            
            if (!dryRun) {
              try {
                const response = await axios.post('https://dev.to/api/articles', article, {
                  headers: {
                    'api-key': apiKey,
                    'Content-Type': 'application/json'
                  }
                });
                console.log(`Successfully published: ${response.data.url}`);
              } catch (error) {
                console.error(`Error publishing article: ${error.message}`);
                if (error.response) {
                  console.error(`Status: ${error.response.status}`);
                  console.error(`Response: ${JSON.stringify(error.response.data, null, 2)}`);
                }
              }
            } else {
              console.log('Article would be published with:');
              console.log(JSON.stringify(article, null, 2));
            }
          }
          
          async function run() {
            console.log(`Found ${files.length} markdown files to publish`);
            for (const file of files) {
              await publishArticle(file);
            }
          }
          
          run().catch(console.error);
          EOF
          
          node publish.js "${{ steps.changed-files.outputs.files }}" ${{ github.event_name == 'workflow_dispatch' && '--dryRun' || '' }}